function lightsData(){const g=S.gs;return S.tok.filter(t=>t.lo&&t.lz>0).map(t=>{const bw=t.z*g,cx=t.x+bw/2,cy=t.y+bw/2,R=t.lz*g,key=[t.x,t.y,t.z,t.lz,g,WV].join();let c=LC.get(t);if(!c||c.k!=key){c={k:key,p:vis(cx,cy,R,S.walls)};LC.set(t,c)}return{cx,cy,R,la:isCone(t)?(t.la>0&&t.la<360?t.la:60):360,ld:((t.r||0)-90)*Math.PI/180,p:c.p}})}
function drawDarkLayer(lg,v,k){d2.setTransform(1,0,0,1,0,0);d2.globalCompositeOperation='source-over';d2.fillStyle='#000';d2.fillRect(0,0,dcv.width,dcv.height);d2.setTransform(v.z*k,0,0,v.z*k,v.x*k,v.y*k);d2.globalCompositeOperation='destination-out';
lg.forEach(L=>{d2.save();if(L.la<360){const h=L.la*Math.PI/360;d2.beginPath();d2.moveTo(L.cx,L.cy);d2.arc(L.cx,L.cy,L.R*1.02,L.ld-h,L.ld+h);d2.closePath();d2.clip()}
d2.beginPath();L.p.forEach((q,i)=>i?d2.lineTo(q[0],q[1]):d2.moveTo(q[0],q[1]));d2.closePath();const gr=d2.createRadialGradient(L.cx,L.cy,L.R*.08,L.cx,L.cy,L.R);gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(.7,'rgba(0,0,0,.9)');gr.addColorStop(1,'rgba(0,0,0,0)');d2.fillStyle=gr;d2.fill();d2.restore()})}
function wpt(p){const h=14/S.v.z;let b=null,bd=h;S.walls.forEach(s=>{[[s.x1,s.y1],[s.x2,s.y2]].forEach(q=>{const dd=Math.hypot(q[0]-p.x,q[1]-p.y);if(dd<bd){bd=dd;b=q}})});if(b)return{x:b[0],y:b[1]};return wsn?{x:Math.round(p.x/S.gs)*S.gs,y:Math.round(p.y/S.gs)*S.gs}:{x:r1(p.x),y:r1(p.y)}}
function wdist(p,s){const dx=s.x2-s.x1,dy=s.y2-s.y1,l=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((p.x-s.x1)*dx+(p.y-s.y1)*dy)/l));return Math.hypot(p.x-(s.x1+t*dx),p.y-(s.y1+t*dy))}
function wallDown(p,dbl){if(wm=='del'||wm=='tg'){let bi=-1,bd=12/S.v.z;S.walls.forEach((s,i)=>{const dd=wdist(p,s);if(dd<bd){bd=dd;bi=i}});if(bi>=0){if(wm=='del')S.walls.splice(bi,1);else if(S.walls[bi].d)S.walls[bi].o=S.walls[bi].o?0:1;save()}return}
if(dbl&&wc){wfin();return}const q=wpt(p);if(!wc)wc={p:[[q.x,q.y]],d:wm=='door'?1:0};else{const l=wc.p[wc.p.length-1];if(l[0]!=q.x||l[1]!=q.y)wc.p.push([q.x,q.y])}}

function wallOpts(B){return `<h5>Desenhar</h5><div class=g2>${[['wall','Parede'],['door','Porta'],['del','Apagar'],['tg','Abrir/fechar']].map(([k,l])=>B('wm',k,l,wm==k)).join('')}</div><label><input type=checkbox data-ws ${wsn?'checked':''}> Encaixar na grade</label><div class=g2>${B('o','wfin','Concluir')}${B('o','wauto','Limpar detectadas')}</div><h5>Iluminação</h5>${B('o','night','Cena escura: '+(S.nt?'ligada':'desligada'),S.nt)}<label>Escuridão <input type=range min=.3 max=1 step=.02 value=${S.dl} data-dl></label><h5>Detecção</h5>${B('o','det','Detectar paredes pelo mapa')}<p class=m style="font-size:12px">Clique para ligar pontos; duplo clique ou Concluir termina. Portas em azul; verde tracejado = aberta. Ligue a luz de um token no menu dele.</p>`}
function detDlg(){if(!S.maps.length)return toast('Adicione um mapa à cena primeiro.');ED={det:1};$('ew').innerHTML=`<h3>Detectar paredes</h3><p class=m style="margin:0;font-size:13px">Analisa as cores do mapa (não é IA): paredes escuras, claras ou de uma cor. Revise o resultado com a borracha.</p><label>Mapa <select id=d_m>${S.maps.map((m,i)=>`<option value=${i} ${m===selM?'selected':''}>${esc((LIB.get(m.i)||{}).n||'Mapa')}</option>`).join('')}</select></label><label>As paredes são <select id=d_mode><option value=dark>Escuras</option><option value=light>Claras</option><option value=color>De uma cor</option></select></label><label>Cor <input type=color id=d_c value=#444444></label><label>Sensibilidade <input type=range id=d_s min=5 max=95 value=35></label><label><input type=checkbox id=d_r checked> Substituir detecções anteriores</label><div class=ra><span class=sp></span><button data-a=e_no>Cancelar</button><button class=add data-a=det_go>Detectar</button></div>`;$('ed').classList.remove('hid')}
function detect(){const m=S.maps[+$('d_m').value],im=m&&(LIB.get(m.i)||{}).img;if(!im||!im.width)return toast('A imagem do mapa ainda não carregou.');const mode=$('d_mode').value,sn=+$('d_s').value/100,rgb=[1,3,5].map(i=>parseInt($('d_c').value.slice(i,i+2),16));
let cell=Math.max(4,Math.ceil(Math.max(im.width,im.height)/300)),sg=[];const T=[[],[[3,2]],[[2,1]],[[3,1]],[[0,1]],[[0,3],[1,2]],[[0,2]],[[0,3]],[[0,3]],[[0,2]],[[0,1],[3,2]],[[0,1]],[[3,1]],[[1,2]],[[3,2]],[]];
for(let tr=0;tr<6;tr++){const cw=Math.ceil(im.width/cell),ch=Math.ceil(im.height/cell),c=document.createElement('canvas');c.width=cw;c.height=ch;const q=c.getContext('2d');q.drawImage(im,0,0,cw,ch);const D=q.getImageData(0,0,cw,ch).data,mk=new Uint8Array(cw*ch);
for(let i=0;i<cw*ch;i++){const r=D[i*4],g=D[i*4+1],b=D[i*4+2];if(D[i*4+3]<20)continue;const L=(.299*r+.587*g+.114*b)/255;mk[i]=mode=='dark'?L<sn*.6:mode=='light'?L>1-sn*.6:Math.hypot(r-rgb[0],g-rgb[1],b-rgb[2])/441<sn*.5}
sg=[];for(let j=0;j<ch-1;j++)for(let i=0;i<cw-1;i++){const k=mk[j*cw+i]*8+mk[j*cw+i+1]*4+mk[(j+1)*cw+i+1]*2+mk[(j+1)*cw+i],E=[[i+1,j+.5],[i+1.5,j+1],[i+1,j+1.5],[i+.5,j+1]];T[k].forEach(([a,b])=>sg.push({x1:r1(m.x+E[a][0]*cell*m.s),y1:r1(m.y+E[a][1]*cell*m.s),x2:r1(m.x+E[b][0]*cell*m.s),y2:r1(m.y+E[b][1]*cell*m.s),d:0,o:0,a:1}))}
if(sg.length<=3500)break;cell=Math.ceil(cell*1.5)}
if($('d_r').checked)S.walls=S.walls.filter(w=>!w.a);S.walls.push(...sg);save();draw();toast(sg.length?sg.length+' trechos de parede detectados. Revise com a borracha e ligue a cena escura.':'Nada detectado: ajuste a sensibilidade ou o tipo de parede.')}
/* música: playlists, fila e efeitos */
const AU=new Audio();let Q=[],QS=[],qi=-1,mtab='pl',fails=0,fxA=[];AU.volume=S.mp.vol;
const mt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},aud=f=>[...LIB.values()].filter(i=>i.k=='aud'&&!!i.fx==!!f).sort(srt),curPl=()=>S.pls.find(p=>p.id==S.mp.pl),shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mq(ids,start){QS=ids.filter(i=>LIB.has(i));if(!QS.length)return toast('Nenhuma música disponível.');let a=[...QS];if(S.mp.sh){shuf(a);if(start){a=a.filter(i=>i!=start);a.unshift(start)}}Q=a;mgo(start&&!S.mp.sh?Math.max(0,a.indexOf(start)):0)}
function mgo(i){const t=LIB.get(Q[i]);qi=i;if(!t)return i+1<Q.length?mgo(i+1):mpr();AU.src=t.url;const p=AU.play();if(p&&p.catch)p.catch(e=>{if(e.name!='AbortError')toast('Não consegui tocar "'+t.n+'". O arquivo pode ser incompatível, ou o navegador exige um clique antes de tocar.')});mpr()}
function mnext(auto){if(!Q.length)return;if(S.mp.rp==2&&auto===true){AU.currentTime=0;AU.play();return}if(qi+1<Q.length)mgo(qi+1);else if(S.mp.rp==1){if(S.mp.sh)shuf(Q);mgo(0)}else{AU.pause();mpr()}}

AU.onended=()=>mnext(true);AU.onplay=AU.onpause=()=>mpr();AU.onplaying=()=>{fails=0};AU.onerror=()=>{toast('Arquivo inválido ou incompatível: '+((LIB.get(Q[qi])||{}).n||''));if(++fails<Q.length)mnext();else fails=0};
AU.ontimeupdate=AU.onloadedmetadata=()=>{if($('mp').classList.contains('hid'))return;$('mpp').value=AU.duration?AU.currentTime/AU.duration*1000:0;$('mpt').textContent=mt(AU.currentTime);$('mpd').textContent=mt(AU.duration)};
$('mpp').oninput=()=>{if(AU.duration)AU.currentTime=$('mpp').value/1000*AU.duration};$('mpv').oninput=e=>{S.mp.vol=+e.target.value;AU.volume=S.mp.vol;save()};
function fx(id){const t=LIB.get(id);if(!t)return;const a=new Audio(t.url);a.volume=S.mp.fxv;a.onended=()=>{fxA=fxA.filter(q=>q!=a)};fxA.push(a);const p=a.play();if(p&&p.catch)p.catch(()=>toast('Não consegui tocar o efeito "'+t.n+'".'))}
function mpr(){const t=LIB.get(Q[qi]),pl=!AU.paused;$('mpn').textContent=t?t.n:'Nada tocando';$('mpl').innerHTML=I(pl?'pause':'play');$('mpb').classList.toggle('on',pl);$('mpb').title=t?'Música: '+t.n:'Música';
$('mpsh').classList.toggle('on',!!S.mp.sh);$('mprp').className=S.mp.rp?'on':'';$('mprp').innerHTML=I('rep')+(S.mp.rp==2?'<small>1</small>':'');$('mpv').value=S.mp.vol;
document.querySelectorAll('#mptabs button').forEach(b=>b.classList.toggle('on',b.dataset.mtab==mtab));if($('mp').classList.contains('hid'))return;mlist()}
function mlist(){const c=$('mpc'),p=curPl(),cur=Q[qi];

else if(mtab=='lib')c.innerHTML=`<p><button data-a=mimp>＋ Importar músicas</button></p>`+(aud(0).map(t=>`<div class="r mrow ${t.id==cur?'np':''}"><span class=mn data-mt=${t.id}>${esc(t.n)}</span><button data-mq=${t.id} title="Adicionar à fila">Fila</button><button data-ma=${t.id} title="Adicionar à playlist atual">＋</button><button data-mdel=${t.id} title="Excluir">Remover</button></div>`).join('')||'<p class=em>Importe arquivos mp3, mp4, m4a, ogg ou wav.</p>');
