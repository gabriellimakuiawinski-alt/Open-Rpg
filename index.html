<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2221">
<title>Open RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Hanken+Grotesk:wght@400;500;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=10">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--tabua)}
body{margin:0;color:var(--giz2);font:16px/1.45 var(--corpo);min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--fita);outline-offset:3px;border-radius:4px}
h1,h2,h3{margin:0;font-weight:400}
.hid{display:none!important}
.sp{flex:1}
.ico svg,.ic svg{display:block;width:100%;height:100%}

/* ---------- logo: d20 com um olho ---------- */
.d20{width:100%;height:100%;overflow:visible;display:block}
.d20 .tr{fill:none;stroke:var(--giz2);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.d20 .fc{fill:var(--giz2);fill-opacity:.06;stroke:none}
.d20 .olho{fill:var(--tabua);stroke:var(--giz2);stroke-width:2.2;transform-box:fill-box;transform-origin:center}
.d20 .iris{fill:var(--carimbo2);transform-box:fill-box;transform-origin:center}
.d20 .pup{fill:#0d1110}

/* ---------- abertura ---------- */
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;background-color:var(--tabua);background-image:radial-gradient(circle at 50% 40%,#2d3a37 0,transparent 62%),radial-gradient(circle at 50% 50%,transparent 55%,#0008 100%),var(--graoc);background-size:auto,auto,180px;background-blend-mode:normal,normal,soft-light}
#splash.sai{animation:iris .85s var(--ease) forwards;pointer-events:none}
@keyframes iris{from{clip-path:circle(150% at 50% 40%)}to{clip-path:circle(0 at 50% 40%)}}
#splash .logo{width:min(46vw,180px);aspect-ratio:1;animation:tremor .5s 2.55s linear}
@keyframes tremor{0%,100%{transform:none}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(2px,2px)}}
#splash .tr{stroke-dasharray:1;stroke-dashoffset:1;animation:traco 1.2s var(--ease) forwards}
#splash .tr.t1{animation-delay:.15s}#splash .tr.t2{animation-delay:.6s}#splash .tr.t3{animation-delay:.9s}
@keyframes traco{to{stroke-dashoffset:0}}
#splash .fc{opacity:0;animation:aparece .8s 1.2s forwards}
@keyframes aparece{to{opacity:1}}
#splash .olho{transform:scaleY(.04);animation:abre .7s 1.5s var(--mola) forwards}
@keyframes abre{to{transform:scaleY(1)}}
#splash .iris,#splash .pup{opacity:0;animation:aparece .3s 1.85s forwards}
#splash .iris{animation:aparece .3s 1.85s forwards,pulsa 1.6s 2.2s ease-in-out infinite}
@keyframes pulsa{50%{transform:scale(1.25)}}
#splash .nome{font:400 clamp(30px,9vw,46px)/1 var(--maq);letter-spacing:.16em;text-transform:uppercase;color:var(--papel2);clip-path:inset(0 100% 0 0);animation:digita 1s 1.9s steps(9) forwards;border-right:3px solid var(--carimbo2);padding:0 .08em 0 .16em;animation-name:digita,cursor;animation-duration:1s,.8s;animation-delay:1.9s,1.9s;animation-timing-function:steps(9),steps(1);animation-fill-mode:forwards,forwards;animation-iteration-count:1,4}
@keyframes digita{to{clip-path:inset(0 0 0 0)}}
@keyframes cursor{0%,100%{border-right-color:var(--carimbo2)}50%{border-right-color:transparent}}
#splash .aberto{position:absolute;margin-top:190px;mix-blend-mode:normal;background:#0003;font-size:clamp(26px,8vw,40px);padding:10px 16px 8px;border-width:4px;opacity:0;transform:rotate(-9deg) scale(2.2);animation:carimba .45s 2.85s var(--mola) forwards}
@keyframes carimba{60%{opacity:.95}to{opacity:.95;transform:rotate(-9deg) scale(1)}}
#splash .frase{font:500 clamp(22px,6vw,28px)/1.1 var(--mao);color:var(--giz);margin-top:150px;opacity:0;animation:aparece .8s 3.3s forwards;text-align:center;padding:0 24px}
#splash .pula{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));color:var(--lapis);font:400 14px var(--maq);opacity:0;animation:aparece .6s 2s forwards}

/* ---------- estrutura ---------- */
#app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
.topo{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 4px}
.selo{width:44px;height:44px;flex:none;background:none;border:0;padding:0;border-radius:50%}
.selo svg{transition:transform .2s}
.selo.gira svg{animation:rola .75s var(--ease)}
@keyframes rola{0%{transform:rotate(0) scale(1)}35%{transform:rotate(300deg) scale(1.35)}100%{transform:rotate(720deg) scale(1)}}
.marca{font:400 19px var(--maq);letter-spacing:.2em;color:var(--papel2);text-transform:uppercase}
.cracha{position:relative;width:46px;height:56px;border:0;border-radius:4px;transform:rotate(3deg);margin-bottom:-14px;transition:transform .3s var(--mola);padding-top:10px;color:var(--tinta);display:grid;place-items:center;font:400 22px var(--maq);background-color:var(--papel2);background-image:var(--grao);background-blend-mode:multiply;box-shadow:0 8px 14px -6px #000c}
.cracha:hover{transform:rotate(-2deg) translateY(6px)}
.cracha .furo{position:absolute;left:50%;top:5px;width:14px;height:5px;margin-left:-7px;border-radius:4px;background:var(--tabua);box-shadow:inset 0 1px 2px #000}
.ola{padding:20px 0 6px}
.ola h1{position:relative;display:inline-block;font:700 clamp(42px,12vw,64px)/1 var(--mao);color:var(--papel2);transform:rotate(-1.2deg)}
.risco{position:absolute;left:0;bottom:-8px;width:100%;height:14px;overflow:visible}
.risco path{fill:none;stroke:var(--carimbo2);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:traco 1s .9s var(--ease) forwards}
@keyframes traco{to{stroke-dashoffset:0}}
.ola p{margin:14px 0 0;color:var(--giz);font:400 15px var(--maq)}
section{margin-top:38px}
.titulo{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.titulo h2{font:400 24px var(--maq);color:var(--papel2);white-space:nowrap}
.titulo::after{content:"";order:5;flex:1;border-bottom:2px dashed #ffffff26;transform:translateY(5px)}
.titulo .chip{font:700 21px var(--mao);color:var(--fita);border:2px solid currentColor;border-radius:50%;min-width:30px;height:30px;display:grid;place-items:center;padding:0 5px;transform:rotate(-6deg)}
.titulo .sec{order:6;color:var(--giz2);font:400 14px var(--maq);text-decoration:underline dashed;text-underline-offset:5px;background:none;border:0;padding:6px}
.titulo .sec:hover{color:var(--fita)}

/* ---------- entrada: as peças são "jogadas" na mesa ---------- */
.entra .ola,.entra .hero,.entra .tile,.entra section{opacity:0;animation:joga .75s var(--mola) forwards}
.entra .ola{animation-delay:.05s}.entra .hero{animation-delay:.2s}
.entra .tile:nth-child(1){animation-delay:.38s}.entra .tile:nth-child(2){animation-delay:.46s}.entra .tile:nth-child(3){animation-delay:.54s}.entra .tile:nth-child(4){animation-delay:.62s}
.entra section{animation-delay:.75s}
@keyframes joga{from{opacity:0;transform:translateY(70px) rotate(calc(var(--r,0deg) + 9deg)) scale(.92)}to{opacity:1;transform:rotate(var(--r,0deg))}}

/* ---------- pasta: última mesa ---------- */
.hero{--r:-.5deg;position:relative;display:block;margin-top:44px;border-radius:3px 12px 8px 8px;padding:24px 20px 22px;min-height:196px;color:var(--tinta);background-color:var(--pasta);background-image:linear-gradient(180deg,#e2c98e 0,#c9aa68 100%),var(--grao);background-blend-mode:normal,multiply;box-shadow:0 2px 0 #00000030,0 24px 34px -18px #000;transform:rotate(var(--r));transition:transform .35s var(--mola)}
.hero:hover{transform:rotate(0) translateY(-4px)}
.hero::before{content:"";position:absolute;left:14px;right:26px;top:-9px;height:22px;background:var(--papel2);transform:rotate(.7deg);z-index:-1;box-shadow:0 -1px 3px #0003}
.aba-pasta,.tag{position:absolute;left:16px;top:-27px;max-width:68%;padding:7px 18px 6px;border-radius:9px 9px 0 0;background:var(--pasta);background-image:var(--grao);background-blend-mode:multiply;font:400 13px var(--maq);letter-spacing:.12em;text-transform:uppercase;color:#4a3d1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 -2px 3px #0002}
.hero .miolo{display:flex;gap:14px;align-items:stretch}
.hero .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;justify-content:center}
.hero h2{font:400 clamp(26px,7vw,36px)/1.05 var(--maq);overflow-wrap:anywhere}
.hero .meta{font:700 22px/1.05 var(--mao);color:var(--caneta);transform:rotate(-1.5deg);transform-origin:left}
.hero .btn{align-self:flex-start;margin-top:10px}
.polaroid{position:relative;flex:none;width:34%;max-width:150px;align-self:center;background:#f8f4e8;padding:7px 7px 22px;transform:rotate(4deg);box-shadow:0 10px 16px -8px #0009;transition:transform .4s var(--mola)}
.hero:hover .polaroid{transform:rotate(-1deg) scale(1.04)}
.polaroid .foto{aspect-ratio:1;background:#33403d center/cover;display:grid;place-items:center;color:var(--giz2);overflow:hidden}
.polaroid .foto svg{width:68%;opacity:.8}
.mancha{position:absolute;right:12px;bottom:8px;width:82px;height:82px;border-radius:50%;border:6px solid #5c3a1822;box-shadow:inset 0 0 0 2px #5c3a1810;transform:rotate(18deg) scaleY(.94);pointer-events:none;mix-blend-mode:multiply}
.hero.vazio{--r:.4deg;background:transparent;background-image:none;border:2px dashed #ffffff30;box-shadow:none;color:var(--giz2);min-height:190px;display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:flex-start}
.hero.vazio::before,.hero.vazio .mancha{display:none}
.hero.vazio .meta{color:var(--giz);font-size:20px}
.hero.vazio .seta{position:absolute;right:20px;bottom:18px;width:84px;color:var(--fita);transform:rotate(8deg)}
.hero.vazio .seta path{stroke-dasharray:1;stroke-dashoffset:1;animation:traco 1s .6s var(--ease) forwards,balanca 2.4s 1.8s ease-in-out infinite}
@keyframes balanca{50%{transform:translateY(4px)}}

/* ---------- atalhos: fichas de cartolina afixadas ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 14px;margin-top:34px}
.tile{--r:-1.4deg;position:relative;display:flex;flex-direction:column;gap:12px;text-align:left;border:0;border-radius:3px;padding:24px 14px 16px;color:var(--tinta);transform:rotate(var(--r));transition:transform .3s var(--mola),box-shadow .3s}
.tile:nth-child(2){--r:1.2deg}.tile:nth-child(3){--r:.8deg}.tile:nth-child(4){--r:-1deg}
.tile:hover{transform:rotate(0) translateY(-6px);box-shadow:0 1px 0 #ffffff55 inset,0 2px 0 #00000026,0 22px 28px -14px #000}
.tile:active{transform:rotate(0) translateY(-1px) scale(.97)}
.tile .ic{width:38px;height:38px;color:var(--carimbo);transition:transform .35s var(--mola)}
.tile:hover .ic{transform:rotate(-10deg) scale(1.15)}
.tile b{font:400 19px/1.1 var(--maq);display:block}
.tile small{display:block;font:700 18px/1 var(--mao);color:var(--caneta);margin-top:4px}

/* ---------- campanhas: pastas ---------- */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:34px 16px;padding-top:16px}
.camp{--r:0deg;position:relative;display:block;min-height:112px;padding:22px 16px 14px;border-radius:2px 10px 6px 6px;color:var(--tinta);background-color:var(--pasta);background-image:linear-gradient(180deg,#dfc487 0,#c6a762 100%),var(--grao);background-blend-mode:normal,multiply;box-shadow:0 2px 0 #00000030,0 16px 22px -14px #000;transition:transform .3s var(--mola);transform-origin:50% 100%}
.camp:nth-child(even){--r:.6deg}.camp:nth-child(odd){--r:-.5deg}
.camp{transform:rotate(var(--r))}
.camp:hover{transform:rotate(0) translateY(-4px)}
.camp::before{content:"";position:absolute;left:12px;right:22px;top:-8px;height:18px;background:var(--papel2);z-index:-1;transform:rotate(-.6deg)}
.camp.abre{animation:abre-pasta .26s var(--ease) forwards}
@keyframes abre-pasta{to{transform:perspective(600px) rotateX(-22deg) translateY(-6px);filter:brightness(1.1)}}
.camp .aba-pasta{top:-25px;font-size:12px;padding:6px 14px 5px}
.camp .c{min-width:0}
.camp b{display:block;font:400 21px/1.1 var(--maq);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:70px}
.camp small{display:block;font:700 20px/1.05 var(--mao);color:var(--caneta);margin-top:3px}
.camp .etq{position:absolute;right:12px;top:14px;font-size:12px}
.vazia{position:relative;border:2px dashed #ffffff2e;border-radius:6px;padding:22px 20px;color:var(--giz);font:400 15px/1.5 var(--maq)}
.vazia b{display:block;color:var(--papel2);font:400 20px var(--maq);margin-bottom:6px}

/* ---------- mesas: registros ---------- */
.lista{display:flex;flex-direction:column;gap:10px}
.lin{display:flex;align-items:center;gap:8px;position:relative;border-radius:2px;color:var(--tinta);padding:10px 12px 10px 38px;transition:transform .25s var(--mola),box-shadow .25s;background-color:var(--papel2);background-image:radial-gradient(circle at 17px 50%,var(--tabua) 5px,transparent 5.5px),var(--grao);background-size:36px 28px,180px;background-repeat:repeat-y,repeat;background-blend-mode:normal,multiply;box-shadow:0 2px 0 #00000030,0 10px 16px -12px #000}
.lin:hover{transform:translateX(6px) rotate(-.3deg)}
.lin .ico{display:none}
.lin .c{flex:1;min-width:0}
.lin b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 18px var(--maq)}
.lin small{display:block;color:var(--tinta2);font:500 14px var(--corpo)}
.lin .mini{flex:none;border:2px solid var(--caneta);color:var(--caneta);background:none;border-radius:4px;padding:5px 8px;font:400 13px var(--maq);letter-spacing:.08em;transition:background .2s,color .2s,transform .2s var(--mola)}
.lin .mini:hover{background:var(--caneta);color:var(--papel2);transform:rotate(-2deg)}

/* ---------- campanha aberta ---------- */
.volta{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:8px 10px 8px 0;color:var(--giz);font:700 21px var(--mao);transition:transform .2s var(--mola),color .2s}
.volta:hover{color:var(--fita);transform:translateX(-4px)}
.cab{position:relative;padding:12px 0 26px}
.cab .etq{position:absolute;right:0;top:20px;font-size:15px;transform:rotate(7deg);color:var(--carimbo2);mix-blend-mode:normal;border-width:3px}
.cab h1{font:400 clamp(32px,9vw,50px)/1.02 var(--maq);color:var(--papel2);overflow-wrap:anywhere;padding-right:96px}
.cab p{margin:10px 0 0;font:700 23px var(--mao);color:var(--giz);transform:rotate(-1deg);transform-origin:left}
.abas{margin-top:4px}
.folha{min-height:240px}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 8px}
.dono{display:flex;align-items:baseline;gap:8px;margin:26px 0 14px;font:400 20px var(--maq);color:var(--tinta)}
.dono:first-child{margin-top:4px}
.dono .av{display:none}
.dono small{font:700 20px var(--mao);color:var(--caneta)}
.fichas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 14px}
.fch{--r:0deg;position:relative;display:flex;flex-direction:column;gap:10px;padding:22px 16px 16px;border-radius:2px;color:var(--tinta);transform:rotate(var(--r));transition:transform .3s var(--mola),box-shadow .3s}
.fch:nth-child(3n+1){--r:-.7deg}.fch:nth-child(3n+2){--r:.6deg}.fch:nth-child(3n){--r:-.3deg}
.fch:hover{transform:rotate(0) translateY(-5px);box-shadow:0 2px 0 #00000026,0 22px 26px -14px #000}
.fch .top{display:flex;gap:8px;align-items:flex-start}
.fch b{font:400 20px/1.1 var(--maq);flex:1;overflow-wrap:anywhere}
.fch .sub{color:var(--tinta2);font:500 14px var(--corpo);margin-top:-4px}
.bs{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.b{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;font:400 13px var(--maq);color:var(--tinta2)}
.b .bar{height:10px;background:repeating-linear-gradient(135deg,#0000000f 0 3px,transparent 3px 6px);border-bottom:2px solid #00000040;position:relative;overflow:hidden}
.b .bar i{display:block;height:100%;width:var(--w);transition:width 1.1s var(--ease);background-image:repeating-linear-gradient(115deg,#00000033 0 1.5px,transparent 1.5px 4px);clip-path:polygon(0 12%,100% 0,98% 100%,0 88%)}
.pre .b .bar i{width:0}
.b em{font-style:normal;color:var(--tinta);font-variant-numeric:tabular-nums;font-size:13px}
.sel2{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sel2 span{font:400 11px/1 var(--maq);letter-spacing:.12em;text-transform:uppercase;border:2px solid var(--lapis);color:var(--lapis);padding:3px 5px 2px;border-radius:3px;transform:rotate(3deg)}
.sel2 .npc{border-color:var(--carimbo);color:var(--carimbo)}
.jog{display:flex;align-items:center;gap:12px;position:relative;padding:10px 12px;border-radius:2px;background-color:var(--papel2);background-image:var(--grao);background-blend-mode:multiply;box-shadow:0 2px 0 #0003,0 8px 14px -10px #000;color:var(--tinta)}
.jog .av{width:44px;height:52px;flex:none;background:#c9bf9f;border:2px solid var(--lapis);display:grid;place-items:center;font:400 22px var(--maq);color:var(--tinta2)}
.jog .c{flex:1;min-width:0}.jog b{display:block;font:400 17px var(--maq);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.jog small{font:700 19px var(--mao);color:var(--caneta)}
.jog select{width:auto;font:400 14px var(--maq)}
.exc{color:var(--carimbo);border:2px solid currentColor;background:none;border-radius:4px;padding:3px 7px;font:400 12px var(--maq);cursor:pointer}
.camp .exc,.fch .exc{position:absolute;right:8px;bottom:8px;z-index:3;background:var(--papel,#e9e0c8)}
.camp,.fch{position:relative}
.jog .mini{color:var(--carimbo);border:2px solid currentColor;background:none;border-radius:4px;padding:4px 8px;font:400 12px var(--maq)}
.codigo{display:inline-flex;align-items:center;gap:12px;font:400 14px var(--maq);color:var(--tinta2)}
.codigo b{font:400 24px var(--maq);letter-spacing:.2em;color:var(--carimbo);border:2px dashed var(--carimbo);padding:3px 10px 1px}
.zona{margin-top:26px;padding-top:18px;border-top:2px dashed #00000030;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.cmb .nex{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px dashed #0003;font:400 15px var(--maq)}.cmb .nex span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cmb .nex b{font:400 17px var(--maq)}.cmb .nex input{width:20px;height:20px;flex:none}
.cmb h3{margin:16px 0 6px;font:400 17px var(--maq)}.cmb .seg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}.cmb select,.cmb input[type=number],.cmb input[type=text]{font:400 15px var(--maq);min-width:0}
.cmb .res{border:2px dashed var(--lapis);border-radius:4px;padding:12px 14px;margin-top:14px;background:#fffdf3aa;color:var(--tinta)}.cmb .res .gr{font:400 26px var(--maq)}.cmb .res .nv{font:700 24px var(--mao)}
.cmb .barra{position:relative;height:12px;border-radius:6px;background:#0002;margin:10px 0 4px;overflow:visible}.cmb .barra i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--lapis)}.cmb .barra u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tinta2);text-decoration:none}
.cmb .res.n-facil-demais,.cmb .res.n-dificil-demais{border-color:#b3412e}.cmb .res.n-equilibrado{border-color:#3a7d44}.cmb .res.n-dificil{border-color:#c47a12}
.cmb .seg input[type=checkbox]{width:20px;height:20px;flex:none}.cmb .q{display:flex;align-items:center;gap:6px}.cmb .q button{padding:2px 10px;font-size:16px}.cmb .m{font:400 13px var(--maq);color:var(--tinta2)}
.dica{margin:10px 0 0;font:700 20px/1.1 var(--mao);color:var(--tinta2)}
.entra-pg{animation:pagina .5s var(--ease)}
@keyframes pagina{from{opacity:0;transform:translateY(34px) rotate(.8deg)}to{opacity:1;transform:none}}

/* ---------- formulários ---------- */
#vel{position:fixed;inset:0;background:#000c;z-index:30;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s;pointer-events:none}
#vel.on{opacity:1;pointer-events:auto}
#jan{width:min(480px,100%);padding:26px 22px calc(22px + env(safe-area-inset-bottom));transform:translateY(60px) rotate(1.5deg);transition:transform .5s var(--mola);max-height:92vh;overflow:auto;border-radius:3px 3px 0 0;background-color:var(--papel2);background-image:repeating-linear-gradient(180deg,transparent 0,transparent 31px,#4a6fa522 31px,#4a6fa522 32px),var(--grao);background-blend-mode:normal,multiply;color:var(--tinta)}
#vel.on #jan{transform:none}
#jan::before{content:"";position:absolute;left:50%;top:-8px;width:80px;height:20px;margin-left:-40px;background:#dcc66ab0;transform:rotate(-2deg)}
@media(min-width:600px){#vel{align-items:center}#jan{border-radius:3px;position:relative}}
#jan form{display:flex;flex-direction:column;gap:14px}
#jan h3{font:400 26px/1.05 var(--maq);color:var(--tinta)}
#jan p{margin:0;font:500 15px/1.4 var(--corpo);color:var(--tinta2)}
#jan label{display:flex;flex-direction:column;gap:2px;font:400 13px var(--maq);color:var(--tinta2);letter-spacing:.06em}
#jan label input,#jan label select{color:var(--caneta);font:700 22px/1.2 var(--mao)}
#jan .aj{font:700 19px/1.1 var(--mao);color:var(--tinta2);min-height:20px;margin-top:-6px}
#jan .err{color:var(--carimbo);font:400 14px var(--maq);min-height:18px}
#jan .bt{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:4px}
#jan .fino{color:var(--tinta2)}
#jan .conta{display:flex;flex-direction:column;gap:12px;align-items:stretch}
#carimbo-ov{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:#0007;opacity:0;animation:vela .75s ease forwards;pointer-events:all}
@keyframes vela{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
#carimbo-ov .etq{font-size:clamp(34px,11vw,56px);border-width:5px;padding:14px 22px 10px;background:#ece4cfee;color:var(--carimbo);mix-blend-mode:normal;transform:rotate(-8deg) scale(2.4);opacity:0;animation:bate .4s var(--mola) .05s forwards;box-shadow:0 0 0 6px #ece4cfee}
@keyframes bate{60%{opacity:1}to{opacity:1;transform:rotate(-8deg) scale(1)}}


/* ---------- ambiente: luz de luminária e poeira ---------- */
.luz{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 75% 55% at 20% -4%,#ffe7b026 0,#ffe7b00d 42%,transparent 72%),radial-gradient(ellipse 120% 70% at 50% 115%,#000a 0,transparent 62%);animation:luminaria 9s steps(1) infinite}
@keyframes luminaria{0%,100%{opacity:1}61%{opacity:.78}62%{opacity:1}64%{opacity:.86}65%{opacity:1}}
#poeira{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* ---------- revelar ao rolar ---------- */
.rv{opacity:0}
.rv.vis{animation:joga .7s var(--mola) var(--d,0ms) both}
.lin.rv.vis{animation:desliza .55s var(--ease) var(--d,0ms) both}
@keyframes desliza{from{opacity:0;transform:translateX(-46px) rotate(-1.5deg)}}
.titulo.rv{opacity:1}.titulo.rv.vis{animation:none}
.titulo.rv h2{clip-path:inset(0 100% 0 0)}
.titulo.rv.vis h2{animation:datilo .75s steps(16) forwards}
@keyframes datilo{to{clip-path:inset(0 0 0 0)}}
.titulo.rv::after{transform:translateY(5px) scaleX(0);transform-origin:left}
.titulo.rv.vis::after{animation:risca .9s .35s var(--ease) forwards}
@keyframes risca{to{transform:translateY(5px) scaleX(1)}}
.titulo.rv .chip{opacity:0}
.titulo.rv.vis .chip{animation:carimba2 .45s .65s var(--mola) forwards}
@keyframes carimba2{from{opacity:0;transform:rotate(-6deg) scale(2.3)}to{opacity:1;transform:rotate(-6deg) scale(1)}}

/* ---------- fichas de cartolina balançam na tachinha ---------- */
.tile{transform-origin:50% 0}
.tile.balanca{animation:balanco .95s var(--ease)}
@keyframes balanco{0%{rotate:0deg}18%{rotate:5deg}42%{rotate:-3.5deg}66%{rotate:1.6deg}84%{rotate:-.6deg}100%{rotate:0deg}}

/* ---------- pasta principal: inclina com o cursor, polaroid revela ---------- */
.hero.inclina{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-4px);transition:transform .12s linear}
.anima .polaroid .foto{animation:revela 2.6s .55s var(--ease) both}
@keyframes revela{from{filter:brightness(2.7) sepia(1) contrast(.35) blur(2px)}60%{filter:brightness(1.2) sepia(.5) contrast(.8) blur(0)}}
.polaroid::before{content:"";position:absolute;inset:7px 7px 22px;background:linear-gradient(115deg,transparent 30%,#ffffff40 48%,transparent 62%);background-size:250% 100%;background-position:100% 0;pointer-events:none;z-index:2;transition:background-position .9s var(--ease)}
.hero:hover .polaroid::before{background-position:-60% 0}

/* ---------- pastas de campanha: a folha de dentro espia ---------- */
.camp::before{transition:transform .35s var(--mola)}
.camp:hover::before{transform:rotate(-1.5deg) translateY(-7px)}
.camp.abre::before{transform:rotate(-3deg) translateY(-18px);transition-duration:.22s}
.camp .aba-pasta{transition:transform .3s var(--mola)}
.camp:hover .aba-pasta{transform:translateY(-3px)}

/* ---------- botão de som ---------- */
.radio{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid #ffffff2a;background:#ffffff08;display:grid;place-items:center;color:var(--giz2);padding:0;position:relative;transition:transform .2s var(--mola),border-color .2s,color .2s}
.radio:hover{transform:scale(1.1) rotate(-6deg);border-color:var(--fita);color:var(--fita)}
.radio:active{transform:scale(.9)}
.radio .ondas{display:flex;gap:3px;align-items:flex-end;height:16px}
.radio .ondas i{width:3px;height:35%;background:currentColor;border-radius:1px}
.radio .ondas i:nth-child(2){height:70%}.radio .ondas i:nth-child(3){height:50%}
.radio.tocando{color:var(--fita);border-color:#dcc66a66}
.radio.tocando .ondas i{height:100%;transform-origin:50% 100%;will-change:transform;animation:eq 1.1s ease-in-out infinite}
.radio.tocando .ondas i:nth-child(2){animation-delay:.25s}.radio.tocando .ondas i:nth-child(3){animation-delay:.5s}.radio.tocando .ondas i:nth-child(4){animation-delay:.12s}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
/* aparelho fraco: sem animações decorativas infinitas */
.leve .luz{animation:none}.leve .hero.vazio .seta path{animation:traco 1s .6s var(--ease) forwards}
.radio.mudo{opacity:.55}.radio.mudo::after{content:"";position:absolute;width:26px;height:2px;background:var(--carimbo2);transform:rotate(-40deg);border-radius:2px}
#som-pop{position:fixed;z-index:45;width:min(270px,calc(100vw - 24px));display:flex;flex-direction:column;gap:10px;padding:18px 16px 14px;color:var(--tinta);border-radius:3px;background-color:var(--papel2);background-image:var(--grao);background-blend-mode:multiply;box-shadow:0 3px 0 #8c8167,0 24px 36px -14px #000;transform-origin:85% 0;animation:pop .35s var(--mola)}
#som-pop.hid{display:none}
@keyframes pop{from{opacity:0;transform:scale(.85) rotate(3deg) translateY(-8px)}}
#som-pop::before{content:"";position:absolute;left:50%;top:-9px;width:60px;height:18px;margin-left:-30px;background:#dcc66ab8;transform:rotate(-3deg)}
#som-pop b{font:400 18px var(--maq);letter-spacing:.08em}
#som-pop small{font:700 17px/1.1 var(--mao);color:var(--tinta2)}
.chave{display:flex;align-items:center;gap:10px;font:400 14px var(--maq);cursor:pointer;padding:4px 0}
.chave span{flex:1}
.chave input{position:absolute;opacity:0;pointer-events:none}
.chave i{width:44px;height:24px;border-radius:14px;background:#00000026;position:relative;transition:background .25s;flex:none}
.chave i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--papel2);box-shadow:0 2px 3px #0005;transition:transform .3s var(--mola)}
.chave input:checked+span+i{background:var(--carimbo)}
.chave input:checked+span+i::after{transform:translateX(20px)}
.chave input:focus-visible+span+i{outline:3px solid var(--fita);outline-offset:2px}
.vol{display:flex;flex-direction:column;gap:4px;font:400 13px var(--maq);color:var(--tinta2)}
.vol input{accent-color:var(--carimbo);width:100%}

@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}.hero{padding:28px 28px 26px;min-height:230px}.polaroid{max-width:190px}}

<body class="quadro">

<div id="splash" class="hid" role="img" aria-label="Open RPG">
  <div class="logo" id="splash-logo"></div>
  <div class="nome">Open RPG</div>

  <div class="pula">toque para entrar</div>
</div>

<div class="luz" aria-hidden="true"></div><canvas id="poeira" aria-hidden="true"></canvas>
<div id="app" class="hid"></div>
<div id="som-pop" class="hid" role="dialog" aria-label="Som"></div>
<div id="vel"><div id="jan" class="papel" role="dialog" aria-modal="true"></div></div>
<div id="aviso" class="nota-adesiva" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="comum.js?v=2"></script>
<script src="som.js?v=9"></script>
<script src="sistemas.js?v=8"></script>
<script>
if(!window.Mesa||!Mesa.db){document.body.innerHTML='<p style="padding:24px;font-size:16px">Não consegui carregar o login. Confira a internet e se o arquivo <b>comum.js</b> está na mesma pasta deste arquivo.</p>';throw new Error('Mesa indisponível')}
const db=Mesa.db;

/* ============ utilidades ============ */
const $=s=>document.querySelector(s),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:(r&3|8)).toString(16)}),
PAPEL={mestre:'Mestre',admin:'Admin',jogador:'Jogador'},
SISN={op:'Ordem Paranormal',modular:'Modular'},nomeSis=c=>SISN[c&&c.sistema]||(c&&'sistema' in c?'Ordem Paranormal':'Ordem Paranormal'),
ini=s=>String(s||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?',
plural=(n,a,b)=>n+' '+(n==1?a:b),
atras=d=>{const s=(Date.now()-new Date(d))/1000;if(s<90)return'agora há pouco';const m=s/60;if(m<60)return'há '+Math.round(m)+' min';const h=m/60;if(h<24)return'há '+Math.round(h)+' h';const dd=Math.round(h/24);return dd==1?'ontem':dd<30?'há '+dd+' dias':'em '+new Date(d).toLocaleDateString('pt-BR')};
let avisoT;function aviso(t){const a=$('#aviso');a.innerHTML=t;a.classList.add('on');window.Som&&Som.fx('postit');clearTimeout(avisoT);avisoT=setTimeout(()=>a.classList.remove('on'),4200)}

/* ícones: traço de caneta */
const IC={
  mesa:'<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4 34 12v16L20 36 6 28V12z"/><path d="M20 13 26 24H14z"/><path d="M6 12l14 8 14-8M20 20v16" opacity=".5"/></svg>',
  ficha:'<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="5" width="26" height="30" rx="2"/><circle cx="20" cy="16" r="4.6"/><path d="M12 29c1.6-4.6 4.4-6 8-6s6.4 1.4 8 6"/><path d="M11 8.5h4" opacity=".5"/></svg>',
  camp:'<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12c0-1.5 1-2.5 2.5-2.5H15l3 4h15.5c1.5 0 2.5 1 2.5 2.5V31c0 1.5-1 2.5-2.5 2.5h-27C5 33.5 4 32.5 4 31z"/><path d="M4 18h32" opacity=".5"/><circle cx="15" cy="25" r="2.4"/><circle cx="25" cy="25" r="2.4"/></svg>',
  chave:'<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="26" r="7"/><circle cx="13" cy="26" r="2" /><path d="M18 21 34 5M28 11l5 5M24 15l4 4"/></svg>',
  volta:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>',
  seta:'<svg class="seta" viewBox="0 0 90 70" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M6 8C30 4 62 14 70 48M70 48 56 38M70 48 80 33"/></svg>'
};

/* logo: d20 com um olho que se abre */
const logoSvg=()=>`<svg class="d20" viewBox="0 0 100 100" aria-hidden="true">
<polygon class="fc" points="50,28 77,68 23,68"/>
<path class="tr t1" pathLength="1" d="M50 4 90 27 90 73 50 96 10 73 10 27Z"/>
<path class="tr t2" pathLength="1" d="M50 28 77 68 23 68Z"/>
<path class="tr t3" pathLength="1" d="M50 4V28M10 27 50 28 90 27M10 27 23 68M90 27 77 68M10 73 23 68M90 73 77 68M50 96 23 68M50 96 77 68"/>
<g><path class="olho" d="M37.5 56Q50 45.5 62.5 56Q50 66.5 37.5 56Z"/><circle class="iris" cx="50" cy="56" r="4.6"/><circle class="pup" cx="50" cy="56" r="1.9"/></g></svg>`;

/* ============ estado ============ */
let ME=null,S={camps:[],cm:[],mesas:[],mb:[],fichas:[],nomes:{},pedidos:[]},ARTE=null,aba='fichas',rotaAnt='';

async function carregar(){
  const[c,cm,m,mb,f,p,pd]=await Promise.all([
    db.from('campanhas').select('*').order('criado_em'),
    db.from('campanha_membros').select('campanha_id,user_id,papel'),
    db.from('mesas').select('id,nome,campanha_id,mestre_id,codigo,cena_ativa,criado_em').order('criado_em'),
    db.from('membros').select('mesa_id,user_id,papel,ultimo_acesso').eq('user_id',ME.id),
    db.from('personagens').select('id,user_id,campanha_id,nome,privada,npc,atualizado_em,stats:dados->stats,info:dados->info,op:dados->op').order('criado_em'),
    db.from('profiles').select('id,nome'),
    db.from('pedidos').select('*').order('criado_em',{ascending:false})]);
  for(const r of[c,cm,m,mb,f,p])if(r.error)throw r.error;
  S.pedidos=pd.error?[]:pd.data;
  S.camps=c.data;S.cm=cm.data;S.mesas=m.data;S.mb=mb.data;S.fichas=f.data;S.nomes={};p.data.forEach(x=>S.nomes[x.id]=x.nome);
  ME.nome=S.nomes[ME.id]||(ME.email||'').split('@')[0]||'Você';
  await carregarArte()}

const meuPapel=c=>{const x=S.cm.find(m=>m.campanha_id==c&&m.user_id==ME.id);return x?x.papel:null},
papelMesa=m=>{const x=S.mb.find(b=>b.mesa_id==m);return x?x.papel:null},
campDe=id=>S.camps.find(c=>c.id==id),
ultima=()=>{let best=null;for(const b of S.mb)if(b.ultimo_acesso&&(!best||b.ultimo_acesso>best.ultimo_acesso))best=b;return best?{...best,mesa:S.mesas.find(m=>m.id==best.mesa_id)}:null};

/* miniatura do mapa da cena ativa, na polaroid (melhor esforço: se falhar, fica o desenho) */
async function carregarArte(){
  ARTE=null;const u=ultima();if(!u||!u.mesa||!u.mesa.cena_ativa)return;
  try{
    const mc=await db.from('mapas_cena').select('arquivo_id').eq('cena_id',u.mesa.cena_ativa);
    if(mc.error||!mc.data.length)return;
    const a=await db.from('arquivos').select('id,miniatura').eq('id',mc.data[0].arquivo_id);
    if(a.error||!a.data.length||!a.data[0].miniatura)return;
    ARTE={mesa:u.mesa.id,img:a.data[0].miniatura}
  }catch(e){}}

/* ============ telas ============ */
function topo(){return`<div class="topo"><button class="selo" data-a="rolar" aria-label="Rolar um d20" title="Rolar um d20">${logoSvg()}</button><div class="marca">Open RPG</div><span class="sp"></span><button class="radio" data-a="som" aria-label="Som e música" title="Som e música"><span class="ondas"><i></i><i></i><i></i><i></i></span></button><button class="cracha" data-a="menu" aria-label="Sua conta: ${esc(ME.nome)}"><i class="furo"></i>${esc(ini(ME.nome).slice(0,1))}</button></div>`}
function saudacao(){const h=new Date().getHours();return h<5?'Boa madrugada':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}

function htmlHero(){
  const u=ultima();
  if(!u||!u.mesa)return`<div class="hero vazio"><h2>Nenhuma mesa aberta ainda</h2><div class="meta">Quando você abrir uma mesa, ela fica aqui para continuar de onde parou.</div><button class="btn" data-a="novaMesa">Criar uma mesa</button>${IC.seta}</div>`;
  const m=u.mesa,c=campDe(m.campanha_id),pp=papelMesa(m.id),
  foto=ARTE&&ARTE.mesa==m.id?`<div class="foto" style="background-image:url('${esc(ARTE.img)}')"></div>`:`<div class="foto">${logoSvg()}</div>`;
  return`<a class="hero" href="mesa.html?mesa=${m.id}" aria-label="Continuar na mesa ${esc(m.nome)}"><span class="tag">${c?esc(c.nome):'Mesa avulsa'}</span>
<div class="miolo"><div class="txt"><h2>${esc(m.nome)}</h2><div class="meta">Você é ${esc((PAPEL[pp]||'jogador').toLowerCase())} · aberta ${esc(atras(u.ultimo_acesso))}</div><span class="btn">Continuar</span></div>
<figure class="polaroid fita" style="margin:0">${foto}</figure></div><i class="mancha"></i></a>`}

function htmlCamps(){
  const l=S.camps.map(c=>{const n=S.cm.filter(m=>m.campanha_id==c.id).length,nm=S.mesas.filter(m=>m.campanha_id==c.id).length,nf=S.fichas.filter(f=>f.campanha_id==c.id).length;
    return`<a class="camp" href="#/c/${c.id}"><span class="aba-pasta">Campanha</span><span class="etq">${esc(PAPEL[meuPapel(c.id)]||'')}</span><div class="c"><b>${esc(c.nome)}</b><small>${plural(n,'pessoa','pessoas')} · ${plural(nm,'mesa','mesas')}</small><small>${plural(nf,'ficha','fichas')}</small></div>${meuPapel(c.id)=='mestre'?`<button class="mini exc" data-del="camp" data-id="${c.id}" title="Excluir">Excluir</button>`:''}</a>`}).join('');
  return l?`<div class="grade">${l}</div>`:`<div class="vazia"><b>Nenhuma campanha ainda</b>Crie uma para reunir seu grupo e as fichas, ou entre com o código que o mestre te passou.</div>`}

function linhaMesa(m,comCamp=true){
  const c=campDe(m.campanha_id),b=S.mb.find(x=>x.mesa_id==m.id),pp=b?b.papel:null,
  quando=b&&b.ultimo_acesso?'aberta '+atras(b.ultimo_acesso):'ainda não aberta';
  const cod=!c&&pp=='mestre'?`<button class="mini" data-a="copiar" data-c="${esc(m.codigo)}" title="Copiar o código para convidar jogadores">Código ${esc(m.codigo)}</button>`:'';
  return`<div class="lin"><a class="c" href="mesa.html?mesa=${m.id}"><b>${esc(m.nome)}</b><small>${comCamp?(c?esc(c.nome):'Mesa avulsa, sem fichas')+' · ':''}${esc(PAPEL[pp]||'')} · ${esc(quando)}</small></a>${cod}${pp=='mestre'?`<button class="mini exc" data-del="mesa" data-id="${m.id}" title="Excluir">Excluir</button>`:''}</div>`}

function htmlMesas(){
  const l=[...S.mesas].sort((a,b)=>{const x=(S.mb.find(m=>m.mesa_id==a.id)||{}).ultimo_acesso||'',y=(S.mb.find(m=>m.mesa_id==b.id)||{}).ultimo_acesso||'';return y>x?1:y<x?-1:0}).map(m=>linhaMesa(m)).join('');
  return l?`<div class="lista">${l}</div>`:`<div class="vazia"><b>Nenhuma mesa ainda</b>A mesa é onde o jogo acontece: mapa, tokens e música.</div>`}

function barras(f){
  const st=(Array.isArray(f.stats)?f.stats:[]).slice(0,3);
  return st.length?`<div class="bs">${st.map(s=>{const mx=+s.max||0,cu=+s.cur||0,w=mx>0?Math.max(0,Math.min(100,cu/mx*100)):0;return`<div class="b"><span>${esc(s.n)}</span><div class="bar"><i style="--w:${w}%;background-color:${esc(s.c||'#6dd36d')}"></i></div><em>${cu}/${mx}</em></div>`}).join('')}</div>`:''}
function cartaoFicha(f){
  const info=Array.isArray(f.info)?f.info:[],g=n=>((info.find(i=>i.n==n)||{}).v||'').toString().trim(),
  sub=['Classe','Origem','NEX'].map(g).filter(Boolean).join(' · ');

async function carregaInim(){if(INIM)return;INIM={meus:[],livro:[],ok:false};

function resumoCombate(c){const st=cmb(c.id),P=S.fichas.filter(f=>f.campanha_id==c.id&&!f.npc);
  const conta=P.map(f=>({f,nex:SIS.nexDaFicha(f.op,f.info)})),usa=conta.filter(x=>x.nex!==null&&!st.fora[x.f.id]);
  const nex=usa.reduce((a,x)=>a+x.nex,0),vd=st.itens.reduce((a,i)=>a+i.vd*i.q,0);
  return{st,conta,nex,vd,r:SIS.dificuldade(nex,vd,st.vet),n:usa.length}}
function blocoResultado(c){const{st,nex,vd,r,n}=resumoCombate(c),A=r.alvos,teto=Math.max(A.dificil*1.3,vd,1);
  const pos=x=>Math.min(100,x/teto*100).toFixed(1);
  return`<div class="res n-${r.nivel}"><div class="gr">VD ${vd} <small class="m">dos inimigos</small> · NEX ${nex} <small class="m">do grupo (${plural(n,'personagem','personagens')})</small></div>

<div class="seg"><input type="text" id="cmb-nome" placeholder="Outro: nome" style="flex:1;min-width:100px"><input type="number" id="cmb-vd" min="1" placeholder="VD" style="width:80px"><button class="btn papel-b" data-a="cmbmao">Adicionar à mão</button></div>

function acaoCombate(a,d){const c=campDe(cid()),st=cmb(c.id);
  if(a=='cmbq'){const i=st.itens[+d.k];if(i){i.q=Math.max(1,Math.min(99,i.q+ +d.d))}}
  else if(a=='cmbdel')st.itens.splice(+d.k,1);
  else if(a=='cmbadd'){const v=($('#cmb-sel')||{}).value||'';if(!v){aviso('Escolha um inimigo na lista.');return}
    const e=(v[0]=='M'?INIM.meus:INIM.livro).find(x=>String(x.id)==v.slice(2));if(!e)return;
    if(!nIni(e.vd)){aviso('Esse inimigo está sem VD. Use "Adicionar à mão" com o valor.');return}
    const j=st.itens.find(i=>i.k==v);if(j)j.q++;else st.itens.push({k:v,nome:e.nome,vd:nIni(e.vd),q:1})}
  else if(a=='cmbmao'){const vd=nIni(($('#cmb-vd')||{}).value);if(!vd){aviso('Digite o VD.');return}
    st.itens.push({k:'x'+Date.now(),nome:($('#cmb-nome')||{}).value.trim()||'Inimigo',vd,q:1})}
  desenhar()}

  aj();f.addEventListener('input',aj);f.addEventListener('change',aj);

const VISTOS=new Set(),calmo=matchMedia('(prefers-reduced-motion: reduce)').matches;
let io=null;
function vivo(anima){
  const alvos=document.querySelectorAll('#app .camp,#app .lin,#app .fch,#app .jog,#app .titulo,#app .vazia');
  if(!io&&'IntersectionObserver' in window)io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;const el=en.target;io.unobserve(el);
    const irmaos=[...el.parentElement.children].filter(x=>x.classList.contains('rv')&&!x.classList.contains('vis'));
    el.style.setProperty('--d',Math.min(6,Math.max(0,irmaos.indexOf(el)))*70+'ms');el.classList.add('vis');
    if(!el.classList.contains('titulo'))el.addEventListener('animationend',function fim(ev){if(ev.target!==el)return;el.removeEventListener('animationend',fim);el.classList.remove('rv','vis')});VISTOS.add(el.dataset.k);
    const ch=el.querySelector('.chip');if(ch)conta(ch)}),{rootMargin:'0px 0px -6% 0px',threshold:.08});
  alvos.forEach((el,i)=>{const k=(el.getAttribute('href')||'')+'|'+el.className.split(' ')[0]+'|'+(el.textContent||'').slice(0,40);el.dataset.k=k;
    if(calmo||!io||(!anima&&VISTOS.has(k)))return;
    el.classList.add('rv');io.observe(el)});
  document.querySelectorAll('#app .titulo .chip').forEach(ch=>{if(calmo||!anima||!io)return;ch.dataset.n=ch.textContent;ch.textContent='0'});
  const h=document.querySelector('#app .hero:not(.vazio)');
  if(h&&matchMedia('(hover: hover)').matches&&!calmo){
    h.addEventListener('pointermove',e=>{const r=h.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;h.style.setProperty('--ry',(x*7).toFixed(2)+'deg');h.style.setProperty('--rx',(-y*6).toFixed(2)+'deg');h.classList.add('inclina')});
    h.addEventListener('pointerleave',()=>{h.style.setProperty('--ry','0deg');h.style.setProperty('--rx','0deg');h.classList.remove('inclina')})}}
function conta(ch){const n=+ch.dataset.n;if(!(n>0)){ch.textContent=ch.dataset.n??ch.textContent;return}let i=0;const passo=()=>{i++;ch.textContent=i;if(i<n)setTimeout(passo,Math.max(40,320/n))};setTimeout(passo,250)}

(function(){
  /* aparelho fraco: sem poeira (era uma animação de tela cheia rodando sem parar) */
  const cv=$('#poeira');if(!cv||calmo||window.LEVE){if(cv)cv.remove();return}const g=cv.getContext('2d');let W,H,P=[];
  const tam=()=>{W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;
    P=Array.from({length:Math.round(Math.min(40,W*H/24000))},()=>({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.8,v:3+Math.random()*9,f:Math.random()*6.28,a:.08+Math.random()*.3}))};
  tam();addEventListener('resize',tam);
  /* 24 quadros por segundo bastam para poeira lenta; para quando a aba some */
  let ult=performance.now(),vai=0;
  function quadro(t){if(document.hidden){vai=0;return}requestAnimationFrame(quadro);if(t-ult<40)return;const dt=Math.min(.08,(t-ult)/1000);ult=t;g.clearRect(0,0,W,H);g.fillStyle='#fff3d6';
    for(const p of P){p.y-=p.v*dt;p.x+=Math.sin(t/2400+p.f)*7*dt;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
      const luz=Math.max(0,1-Math.hypot(p.x/W-.22,p.y/H-.05)*1.25);
      g.globalAlpha=p.a*(.35+luz)*(.7+.3*Math.sin(t/700+p.f));g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill()}}
  const liga=()=>{if(!vai&&!document.hidden){vai=1;ult=performance.now();requestAnimationFrame(quadro)}};
  document.addEventListener('visibilitychange',liga);liga()})();

/* ============ tempo real: o início se mantém atualizado ============ */
let rt;function recarregar(){clearTimeout(rt);rt=setTimeout(async()=>{if(fecha)return recarregar();try{await carregar();desenhar()}catch(e){}},500)}
function ouvir(){
  const ch=db.channel('inicio');['personagens','campanhas','campanha_membros','mesas','membros','pedidos'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},recarregar));
  ch.subscribe()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ME)recarregar()});

/* ============ abertura animada ============ */
function abertura(){return new Promise(ok=>{
  if(sessionStorage.getItem('open_rpg_abertura')){ok(false);return}
  sessionStorage.setItem('open_rpg_abertura','1');
  const s=$('#splash');$('#splash-logo').innerHTML=logoSvg();s.classList.remove('hid');
  const curto=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let feito=false;const t0=Date.now();
  const fim=()=>{if(feito)return;feito=true;s.classList.add('sai');setTimeout(()=>{s.classList.add('hid');ok(true)},curto?10:850)};
  s.onclick=()=>{if(Date.now()-t0>500)fim()};
  addEventListener('keydown',()=>{if(Date.now()-t0>500)fim()},{once:true});
  s.addEventListener('pointermove',e=>{const r=s.getBoundingClientRect(),
    dx=(e.clientX/r.width-.5)*4,dy=(e.clientY/r.height-.5)*3;s.querySelectorAll('.pup').forEach(el=>el.style.transform=`translate(${dx}px,${dy}px)`)});
  setTimeout(fim,curto?600:4600)})}

/* ============ início ============ */
(async()=>{
  try{
    const u=await Mesa.exigirLogin();ME={id:u.id,email:u.email,nome:''};
    const ab=abertura(),dados=carregar();
    const[comAbertura]=await Promise.all([ab,dados]);
    const app=$('#app');app.classList.remove('hid');
    if(comAbertura)app.classList.add('entra');
    desenhar(true);ouvir();
    setTimeout(()=>app.classList.remove('entra'),2200)
  }catch(e){
    $('#splash').classList.add('hid');const app=$('#app');app.classList.remove('hid');
    app.innerHTML=`<div class="vazia" style="margin-top:80px"><b>Não consegui carregar</b>${esc(e.message||e)}<br><br><button class="btn" onclick="location.reload()">Tentar de novo</button></div>`}
})();
</script>
