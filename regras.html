<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Regras · Open RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Hanken+Grotesk:wght@400;500;700&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tema.css?v=10">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--tabua)}body{margin:0;color:var(--giz2);font:16px/1.45 var(--corpo);min-height:100vh}
header{background:#151b1ae6;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:2px dashed #ffffff22;position:sticky;top:0;z-index:5}
header a{color:var(--giz2);font:400 14px var(--maq);text-decoration:underline dashed;text-underline-offset:5px}header h1{margin:0;font:400 20px var(--maq);color:var(--papel2);flex:1;min-width:140px}
main{max-width:860px;margin:0 auto;padding:14px 14px 60px}
button{background:var(--papel3);color:var(--tinta);border:0;border-radius:4px;padding:9px 13px;font:400 14px var(--maq);cursor:pointer;box-shadow:0 3px 0 #8c8167}
button:active{transform:translateY(2px);box-shadow:none}button.on{background:var(--carimbo);color:var(--papel2);box-shadow:0 3px 0 var(--carimbo-sombra)}
.abas{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}.filtros button{padding:6px 10px;font-size:12px}
input.busca{width:100%;background:#0003;color:var(--giz2);border:1px solid #ffffff22;border-radius:4px;padding:10px;font:16px var(--corpo)}
h2{font:400 16px var(--maq);color:var(--papel2);margin:18px 0 8px;letter-spacing:.06em}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.rg{background-color:var(--papel2);color:var(--tinta);border-radius:3px;padding:12px;box-shadow:0 2px 0 #0003,0 10px 16px -10px #000;display:flex;flex-direction:column;gap:4px}
.rg b{font:400 18px var(--maq)}.rg p{margin:0;font-size:15px}.rg small{font:400 12px var(--maq);color:var(--tinta2)}
.tg{display:inline-block;padding:1px 7px;border-radius:9px;font:400 11px var(--maq);color:#fff;background:#555;margin-right:6px}
.tg.medo{background:#6b4b9a}.tg.mental{background:#2f6f8f}.tg.paralisia{background:#8a5a1f}.tg.sentidos{background:#3d7a4a}.tg.fadiga{background:#8f3a3a}
.compt{display:inline-block;padding:0 6px;border-radius:8px;font:400 11px var(--maq);background:#7a2e2e;color:#fff;vertical-align:middle}
.vazio{padding:24px;border:2px dashed #ffffff33;border-radius:4px;text-align:center;opacity:.9}
</style><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icones/icone-192.png"><link rel="apple-touch-icon" href="icones/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"></head><body>
<header><a href="index.html">Início</a><h1>Regras do livro</h1></header>
<main>
<div class="abas"><button data-t="condicao" class="on">Condições</button><button data-t="perigo">Perigos</button><button data-t="regra">Cálculos</button><button data-t="jogo">Novas regras <span class="compt">SaH</span></button><button data-t="opcional">Regras opcionais <span class="compt">SaH</span></button></div>
<p id="dica" class="vazio" style="display:none;padding:10px;text-align:left"></p>
<input class="busca" id="q" placeholder="Buscar pelo nome ou texto">
<div id="lst"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="comum.js?v=2"></script>
<script>
if(!window.Mesa||!Mesa.db){document.body.innerHTML='<p style="padding:24px">Não consegui carregar o login. Confira a internet.</p>';throw new Error('Mesa indisponível')}
const db=Mesa.db,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
let L=[],TAB='condicao',Q='';
const DICA={jogo:'Regras novas do Sobrevivendo ao Horror: valem junto com o livro básico (medo, perseguição, furtividade, investigação, fabricação e folgas).',opcional:'Regras opcionais do Sobrevivendo ao Horror: só valem se o mestre escolher. Marque as que sua mesa usa em Sistema e regras da campanha.'};
function desenha(){const dc=$('#dica');dc.style.display=DICA[TAB]?'block':'none';dc.textContent=DICA[TAB]||'';
  const t=norm(Q),A=L.filter(x=>x.grupo==TAB&&(!t||norm(x.nome+' '+x.texto+' '+(x.subgrupo||'')).includes(t)));
  if(!A.length){$('#lst').innerHTML='<p class="vazio">Nada por aqui.</p>';return}
  let ult=null,h='<div class="lista">';
  A.forEach(x=>{
    if(TAB!='condicao'&&TAB!='regra'&&x.subgrupo!=ult){ult=x.subgrupo;h+=`</div><h2>${esc(x.subgrupo)}</h2><div class="lista">`}
    h+=`<div class="rg"><b>${esc(x.nome)}</b>${TAB=='condicao'&&x.dados&&x.dados.tipo&&x.dados.tipo!='outra'?`<span><span class="tg ${esc(x.dados.tipo)}">condição de ${esc(x.dados.tipo)}</span></span>`:''}<p>${esc(x.texto)}</p><small>${x.fonte=='sah'?'<span class="compt">SaH</span> Sobrevivendo ao Horror':'Livro'}, p. ${x.pagina}</small></div>`});
  $('#lst').innerHTML=h+'</div>'}
document.querySelectorAll('.abas button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;document.querySelectorAll('.abas button').forEach(x=>x.classList.toggle('on',x==b));desenha()});
$('#q').oninput=e=>{Q=e.target.value;desenha()};
(async()=>{
  await Mesa.exigirLogin();
  const r=await db.from('livro_regras').select('ref,grupo,subgrupo,nome,ordem,pagina,texto,dados,fonte').eq('sistema','op').order('ordem');
  if(r.error||!r.data.length){$('#lst').innerHTML='<p class="vazio">Regras indisponíveis. O mestre precisa rodar o SQL schema_etapa11_regras.sql no Supabase.</p>';return}
  L=r.data;const h=location.hash.slice(1);if(DICA[h]||h=='perigo'||h=='regra'){TAB=h;document.querySelectorAll('.abas button').forEach(x=>x.classList.toggle('on',x.dataset.t==h))}
  if(!L.some(x=>x.fonte=='sah'))DICA.jogo=DICA.opcional='Ainda sem as regras do Sobrevivendo ao Horror: o mestre precisa rodar o SQL schema_etapa15_sah_livro.sql no Supabase.';desenha()})();
</script></body></html>
