<script>
if(!window.Mesa||!Mesa.db){document.body.innerHTML='<p style="padding:24px;font-size:16px">Não consegui carregar o login. Confira a internet e se o arquivo <b>comum.js</b> está na mesma pasta deste arquivo.</p>';throw new Error('Mesa indisponível')}
const db=Mesa.db;

/* ============ UTILIDADES ============ */
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),
uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:(r&3|8)).toString(16)}),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=n=>Math.round(n*100)/100,
ss=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v); // texto estável (o banco reordena as chaves)

/* ============ MODELO (exemplo: Ordem Paranormal) ============
   Tudo é dado, nada é fixo no código: atributos, perícias, campos, barras e itens
   são listas editáveis. Para outro sistema, basta mudar o modelo abaixo. */
const ATTRS=[['agi','AGI'],['for','FOR'],['int','INT'],['pre','PRE'],['vig','VIG']];
const PERICIAS=[['Acrobacia','agi'],['Adestramento','pre'],['Artes','pre'],['Atletismo','for'],['Atualidades','int'],['Ciências','int'],['Crime','agi'],['Diplomacia','pre'],['Enganação','pre'],['Fortitude','vig'],['Furtividade','agi'],['Iniciativa','agi'],['Intimidação','pre'],['Intuição','pre'],['Investigação','int'],['Luta','for'],['Medicina','int'],['Ocultismo','int'],['Percepção','pre'],['Pilotagem','agi'],['Pontaria','agi'],['Profissão','int'],['Reflexos','agi'],['Religião','pre'],['Sobrevivência','int'],['Tática','int'],['Tecnologia','int'],['Vontade','pre']];
const TREINO=[[0,'Destreinado'],[5,'Treinado +5'],[10,'Veterano +10'],[15,'Expert +15']];
function nova(nome,demo){
  const f={v:1,id:uuid(),nome,
    info:['Jogador','Origem','Classe','Trilha','NEX','Patente','Defesa','Deslocamento'].map(n=>({n,v:''})),
    attrs:ATTRS.map(([id,n])=>({id,n,v:1})),
    stats:[{id:'pv',n:'PV',cur:0,max:0,c:'#ee4444'},{id:'pe',n:'PE',cur:0,max:0,c:'#b980ff'},{id:'san',n:'SAN',cur:0,max:0,c:'#44aaff'}],
    skills:PERICIAS.map(([n,a])=>({id:uid(),n,a,t:0,o:0})),
    inv:{capAttr:'for',capMult:5,capExtra:0,items:[]},poderes:[],notas:''};
  if(demo){
    const set=(n,v)=>f.info.find(x=>x.n==n).v=v;
    set('Jogador','Seu nome');set('Origem','Policial');set('Classe','Combatente');set('NEX','5%');set('Defesa','12');set('Deslocamento','9 m');
    [2,3,1,1,3].forEach((v,i)=>f.attrs[i].v=v);
    [[20,20],[6,6],[12,12]].forEach(([c,m],i)=>{f.stats[i].cur=c;f.stats[i].max=m});
    ['Luta','Pontaria','Fortitude','Percepção'].forEach(n=>f.skills.find(s=>s.n==n).t=5);
    f.skills.find(s=>s.n=='Luta').o=2;
    const CT={arma:'Arma',protecao:'Proteção',municao:'Munição',consumivel:'Consumível',geral:'Geral'};
    f.inv.items=[['Pistola',1],['Balas curtas',2],['Proteção leve',1,true],['Cicatrizante',1],['Lanterna',1]].map(([n,q,eq])=>{const c=JSON.parse(JSON.stringify(SIS.CATALOGO.op.find(x=>x.n==n)));return{...c,id:uid(),cat:CT[c.tipo]||'Geral',qtd:q,eq:!!eq,desc:''}});
    f.poderes=[{id:uid(),n:'Poder de exemplo',desc:'Descrição editável. Cada poder, ritual ou habilidade vira um cartão.'}];
    f.notas='Anotações livres do jogador.'}
  return f}

/* ============ ESTADO ============
   Cada ficha na tela é o conteúdo de "personagens.dados" + metadados com "_"
   (_camp, _dono, _donoNome) que NÃO são gravados dentro de dados. */
let ME=null,ALL=[],CAMPS=[],CM=[],SEL=localStorage.mesa_ficha_sel,tab='g',tt;const PEND=new Map(),NOMES={};
/* ficha com dados faltando (criada por fora, ou de versão antiga) ganha o que falta, em vez de quebrar a tela */
const completa=d=>{const b=nova('');for(const k of['info','attrs','stats','skills','poderes'])if(!Array.isArray(d[k]))d[k]=b[k];
  if(!d.inv||typeof d.inv!='object'||!Array.isArray(d.inv.items))d.inv={...b.inv,...(d.inv&&typeof d.inv=='object'?d.inv:{}),items:[]};
  if(!Array.isArray(d.docs))d.docs=[];if(!Array.isArray(d.secoes))d.secoes=[];if(typeof d.notas!='string')d.notas='';return d},
dadosDe=f=>{const{_camp,_dono,_donoNome,_priv,_npc,_din,...d}=f;return d},
fromRow=r=>({...completa(r.dados||{}),id:r.id,nome:r.nome,_camp:r.campanha_id,_dono:r.user_id,_donoNome:NOMES[r.user_id]||'',_priv:!!r.privada,_npc:!!r.npc,_din:r.dinheiro==null?undefined:+r.dinheiro}),
sisDe=f=>SIS.sistemaDe(CAMPS.find(c=>c.id==f._camp),f),ehOP=f=>!!f&&sisDe(f)=='op',
curF=()=>ALL.find(f=>f.id==SEL),av=(f,id)=>{const a=f.attrs.find(a=>a.id==id);return a?+a.v||0:0},
getP=(o,p)=>p.split('.').reduce((t,k)=>t==null?t:t[k],o),
setP=(o,p,v)=>{const k=p.split('.');let t=o;for(let i=0;i<k.length-1;i++){if(t[k[i]]==null||typeof t[k[i]]!='object')t[k[i]]={};t=t[k[i]]}t[k[k.length-1]]=v},
listOf=(f,l)=>l=='items'?f.inv.items:f[l],
ordenar=()=>ALL.sort((x,y)=>(x._dono==ME.id?0:1)-(y._dono==ME.id?0:1)),
meuPapel=c=>{const x=CM.find(b=>b.campanha_id==c&&b.user_id==ME.id);return x?x.papel:null},
podeEditar=f=>f._dono==ME.id||meuPapel(f._camp)=='mestre'||(meuPapel(f._camp)=='admin'&&!f._priv&&!f._npc);
let DOCI=-1;
function comprime(file){return new Promise((ok,no)=>{const im=new Image,u=URL.createObjectURL(file);im.onload=()=>{URL.revokeObjectURL(u);
  const m=1100,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.74,o=c.toDataURL('image/jpeg',q);while(o.length>420000&&q>.3){q-=.12;o=c.toDataURL('image/jpeg',q)}ok(o)};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Imagem inválida'))};im.src=u})}
function verDoc(dc){if(!dc)return;const o=document.createElement('div');o.id='docver';o.innerHTML=`<div class=dv><b>${esc(dc.t||'Documento')}</b>${dc.img?`<img src="${esc(dc.img)}">`:''}${dc.txt?`<p>${esc(dc.txt)}</p>`:''}<button data-x>Fechar</button></div>`;o.onclick=e=>{if(e.target===o||e.target.closest('[data-x]'))o.remove()};document.body.append(o)}
function toast(h){const t=$('#toast');t.innerHTML=h;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),6000)}
const status=t=>$('#st').textContent=t;

/* ============ NUVEM (Supabase) ============ */
async function carregarNomes(){const r=await db.from('profiles').select('id,nome');if(r.error)throw r.error;r.data.forEach(p=>NOMES[p.id]=p.nome);ALL.forEach(f=>f._donoNome=NOMES[f._dono]||'')}
async function carregar(){
  const[a,m,b]=await Promise.all([db.from('personagens').select('*').order('criado_em'),db.from('campanhas').select('*').order('criado_em'),db.from('campanha_membros').select('campanha_id,user_id,papel')]);
  if(a.error)throw a.error;if(m.error)throw m.error;if(b.error)throw b.error;
  CAMPS=m.data;CM=b.data;await carregarNomes();ALL=a.data.map(fromRow);ordenar()}
async function inserir(f){
  const{error}=await db.from('personagens').insert({id:f.id,user_id:ME.id,campanha_id:f._camp||null,nome:f.nome||'',dados:dadosDe(f),privada:!!f._priv,npc:!!f._npc});
  if(error)throw error;f._dono=ME.id;f._donoNome=''}
function erro(e){status('erro ao salvar');toast('Não consegui salvar: '+esc(e.message||e))}
async function gravar(f){PEND.delete(f.id);
  const{data,error}=await db.from('personagens').update({nome:f.nome||'',dados:dadosDe(f),campanha_id:f._camp||null,privada:!!f._priv,npc:!!f._npc}).eq('id',f.id).select('id');
  if(error)return erro(error);if(!data||!data.length)return erro('sem permissão para alterar esta ficha');
  if(!PEND.size)status('salvo ✓')}
function touch(f=curF()){if(!f)return;clearTimeout(PEND.get(f.id));status('salvando…');PEND.set(f.id,setTimeout(()=>gravar(f),700))}
function flush(){[...PEND.keys()].forEach(id=>{const f=ALL.find(x=>x.id==id);clearTimeout(PEND.get(id));if(f)gravar(f);else PEND.delete(id)})}
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
async function criarPadrao(){const n=nova('Agente Exemplo',true);await inserir(n);ALL.push(n);SEL=n.id}
async function migrarLocal(){ // uma vez só: leva para a conta as fichas que estavam só neste navegador
  let loc=[];try{loc=JSON.parse(localStorage.getItem('mesa_fichas_v1')||'[]')}catch(e){}
  loc=loc.filter(x=>x&&x.attrs&&x.skills&&x.inv&&x.stats&&x.info);
  for(const x of loc){x.id=uuid();x._camp=null;await inserir(x);ALL.push(x)}
  localStorage.mesa_migrado='1';return loc.length}

const sig=f=>[f.info,f.attrs,f.stats,f.skills,f.poderes,f.docs,f.inv&&f.inv.items].map(a=>(a||[]).length).join();
function patch(f){document.querySelectorAll('#app [data-p]').forEach(el=>{if(el===document.activeElement)return;const v=getP(f,el.dataset.p);if(v!==undefined&&el.value!=v)el.value=v});derive()}
function aplicar(novo){
  const i=ALL.findIndex(x=>x.id==novo.id);
  if(i<0){ALL.push(novo);ordenar();render();return}
  const cur=ALL[i];
  if(ss(dadosDe(cur))==ss(dadosDe(novo))&&cur._camp==novo._camp&&cur._priv==novo._priv&&cur._npc==novo._npc&&cur._din==novo._din)return; // eco da nossa própria gravação
  if(PEND.has(cur.id))return; // temos edição local ainda não enviada: ela prevalece
  const a=document.activeElement,foco=!!(a&&$('#app').contains(a)),eraSel=cur.id==SEL;
  if(eraSel&&foco&&sig(cur)!=sig(novo)){toast('Esta ficha foi alterada por outra pessoa. Saia do campo em que está digitando para atualizar.');return}
  ALL[i]=novo;
  if(!eraSel)renderSel();else if(foco){renderSel();patch(novo)}else render()}
function ouvir(){
  db.channel('fichas').on('postgres_changes',{event:'*',schema:'public',table:'personagens'},async p=>{
    try{
      if(p.eventType=='DELETE'){const id=p.old.id;if(!ALL.some(x=>x.id==id))return;ALL=ALL.filter(x=>x.id!=id);if(!ALL.length)await criarPadrao();if(SEL==id||!curF())SEL=ALL[0].id;render();return}
      let r=p.new;
      if(!r.dados||!Object.keys(r.dados).length){const q=await db.from('personagens').select('*').eq('id',r.id).maybeSingle();if(!q.data)return;r=q.data}
      if(!(r.user_id in NOMES))await carregarNomes();
      aplicar(fromRow(r))
    }catch(e){}
  }).subscribe(s=>{if(s=='CHANNEL_ERROR'||s=='TIMED_OUT')toast('Atualização ao vivo indisponível no momento. Suas edições continuam sendo salvas.')})}

    ct.textContent=`${fmt(used)} / ${fmt(cap)} espaços`+(used>cap?' — sobrecarregado':'');ct.className=used>cap?'over':'m';cb.style.width=(cap>0?Math.min(100,used/cap*100):used>0?100:0)+'%';cb.style.background=used>cap?'#e44':'var(--a)'}}

  }catch(e){toast('Erro ao iniciar: '+esc(e.message||e));status('sem conexão')}
})();
</script></body></html>
